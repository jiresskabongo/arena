# EventFlow — Render Blueprint (déploiement 1-clic : app + PostgreSQL)
# Docs : https://docs.render.com/deploy-blueprint
# Usage : Render → « New » → « Blueprint » → sélectionner ce repo.
services:
  - type: web
    name: eventflow
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy:
      enabled: true
    envVars:
      # Postgres provisionné par ce même blueprint
      - key: DATABASE_URL
        fromDatabase:
          name: eventflow-db
          property: connectionString
      # Clés générées aléatoirement par Render
      - key: SECRET_KEY
        generateValue: true
      - key: MOCK_WEBHOOK_SECRET
        generateValue: true
      - key: SESSION_TTL_DAYS
        value: "30"
      # Seed idempotent au démarrage (plans, templates, super admin)
      - key: SEED_ON_BOOT
        value: "true"
      # ⚠ À renseigner DANS L'UI après le 1er deploy : l'URL publique du service
      # (Render → service → Settings → Environment → APP_URL).
      - key: APP_URL
        sync: false

databases:
  - name: eventflow-db
    plan: free
